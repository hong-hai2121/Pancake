<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Pancake Watcher — Lịch sử hội thoại</title>
<style>
  :root {
    --bg: #f3f4f6;
    --card: #ffffff;
    --border: #e2e5eb;
    --primary: #4338ca;
    --primary-hover: #3730a3;
    --text: #1f2937;
    --muted: #6b7280;
    --success: #16a34a;
    --danger: #ef4444;
    --danger-soft: #fee2e2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 18px 24px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 2;
  }
  h1 {
    margin: 0;
    font-size: 18px;
  }
  .subtitle {
    margin: 4px 0 0;
    font-size: 12px;
    color: var(--muted);
  }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 24px 0;
  }
  #filter {
    flex: 1;
    max-width: 320px;
    padding: 8px 10px;
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card);
    color: var(--text);
  }
  button.action {
    font-size: 12px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
  }
  button.action:hover { background: #f3f4f6; }
  #refreshBtn {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  #refreshBtn:hover { background: var(--primary-hover); }
  .count {
    font-size: 12px;
    color: var(--muted);
    margin-left: auto;
  }
  .table-wrap {
    margin: 14px 24px 24px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid #f1f5f9;
    white-space: nowrap;
  }
  td.snippet-cell {
    white-space: normal;
    max-width: 360px;
    color: #374151;
  }
  th {
    position: sticky;
    top: 0;
    background: #fafafa;
    font-weight: 600;
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    user-select: none;
  }
  th.sortable { cursor: pointer; }
  th.sortable:hover { color: var(--primary); }
  th .arrow { opacity: 0.5; margin-left: 3px; }
  tr:hover td { background: #f8fafc; }
  .name-cell { font-weight: 600; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
  }
  .badge-negative { background: var(--danger-soft); color: #b91c1c; }
  .badge-scanned { background: #dcfce7; color: #15803d; }
  .badge-pending { background: #f3f4f6; color: var(--muted); }
  .unread-chip {
    background: #e2474f;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 999px;
    margin-left: 6px;
  }
  .del-btn {
    font-size: 11px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid var(--danger);
    background: var(--card);
    color: var(--danger);
    cursor: pointer;
  }
  .del-btn:hover { background: var(--danger-soft); }
  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 40px 12px;
  }
</style>
</head>
<body>
  <header>
    <h1>🐼 Pancake Watcher — Lịch sử hội thoại</h1>
    <p class="subtitle">Toàn bộ hội thoại đã quét được, kèm trạng thái quét cảm xúc. Bấm tiêu đề cột để sắp xếp.</p>
  </header>

  <div class="toolbar">
    <input id="filter" type="text" placeholder="Lọc theo tên / nội dung / trang..." />
    <button class="action" id="refreshBtn">↻ Làm mới</button>
    <span class="count" id="count"></span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="sortable" data-sort="name">Khách hàng<span class="arrow"></span></th>
          <th class="sortable" data-sort="platform">Nền tảng<span class="arrow"></span></th>
          <th>Nội dung</th>
          <th title="Giờ hiển thị trên Pancake (time_text) — chuỗi thô, không phải timestamp đầy đủ nên không sort được">Giờ tin nhắn</th>
          <th class="sortable" data-sort="detected_at">Phát hiện lúc<span class="arrow"></span></th>
          <th class="sortable" data-sort="last_seen_at">Lần cuối thấy<span class="arrow"></span></th>
          <th class="sortable" data-sort="sentiment_checked_at">Trạng thái quét<span class="arrow"></span></th>
          <th>Hành động</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" hidden>Không có dữ liệu.</div>
  </div>

<script>
const API_LIST = "/api/customers";
const API_DELETE = "/api/customers/";

let sortCol = "detected_at";
let sortDir = "desc";
let allItems = [];

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return escapeHtml(iso);
  return d.toLocaleString("vi-VN");
}

function fmtPlatform(cls) {
  if (!cls) return "";
  if (cls.includes("facebook")) return "Facebook";
  if (cls.includes("zalo")) return "Zalo";
  return cls.replace("platform-", "");
}

function sentimentBadge(item) {
  if (!item.sentimentCheckedAt) {
    return '<span class="badge badge-pending">⏳ Chưa quét</span>';
  }
  if (item.sentiment === "negative") {
    return '<span class="badge badge-negative" title="Phương pháp: ' + escapeHtml(item.sentimentMethod) + '">⚠️ Tiêu cực</span>';
  }
  return '<span class="badge badge-scanned" title="Phương pháp: ' + escapeHtml(item.sentimentMethod) + '">✅ Đã quét</span>';
}

async function fetchData() {
  const res = await fetch(`${API_LIST}?sort=${encodeURIComponent(sortCol)}&order=${encodeURIComponent(sortDir)}`);
  const data = await res.json();
  allItems = data.items || [];
  render();
}

function render() {
  const filterText = document.getElementById("filter").value.trim().toLowerCase();
  const items = filterText
    ? allItems.filter((it) =>
        [it.name, it.snippet, it.pageId, it.convId].some((v) => (v || "").toLowerCase().includes(filterText))
      )
    : allItems;

  document.querySelectorAll("th.sortable .arrow").forEach((el) => (el.textContent = ""));
  const activeTh = document.querySelector(`th[data-sort="${sortCol}"] .arrow`);
  if (activeTh) activeTh.textContent = sortDir === "asc" ? "▲" : "▼";

  const tbody = document.getElementById("tbody");
  const empty = document.getElementById("empty");
  document.getElementById("count").textContent = `${items.length} hội thoại`;

  if (!items.length) {
    tbody.innerHTML = "";
    empty.hidden = false;
    return;
  }
  empty.hidden = true;

  tbody.innerHTML = items
    .map(
      (it) => `
    <tr data-raw-id="${escapeHtml(it.rawId)}">
      <td class="name-cell">${escapeHtml(it.name || it.rawId)}${
        it.unreadCount > 0 ? `<span class="unread-chip">${escapeHtml(String(it.unreadCount))}</span>` : ""
      }</td>
      <td>${escapeHtml(fmtPlatform(it.platform))}</td>
      <td class="snippet-cell">${escapeHtml(it.snippet)}</td>
      <td>${escapeHtml(it.time)}</td>
      <td>${fmtTime(it.detectedAt)}</td>
      <td>${fmtTime(it.lastSeenAt)}</td>
      <td>${sentimentBadge(it)}</td>
      <td><button class="del-btn" data-raw-id="${escapeHtml(it.rawId)}">🗑️ Xóa</button></td>
    </tr>`
    )
    .join("");

  tbody.querySelectorAll(".del-btn").forEach((btn) => {
    btn.addEventListener("click", () => deleteRow(btn.dataset.rawId));
  });
}

async function deleteRow(rawId) {
  const item = allItems.find((it) => it.rawId === rawId);
  const label = item ? item.name || rawId : rawId;
  if (!confirm(`Xóa hội thoại của "${label}" khỏi lịch sử? Không thể hoàn tác.`)) return;
  const res = await fetch(API_DELETE + encodeURIComponent(rawId), { method: "DELETE" });
  if (!res.ok) {
    alert("Xóa thất bại — server có đang chạy không?");
    return;
  }
  allItems = allItems.filter((it) => it.rawId !== rawId);
  render();
}

document.querySelectorAll("th.sortable").forEach((th) => {
  th.addEventListener("click", () => {
    const col = th.dataset.sort;
    if (col === sortCol) {
      sortDir = sortDir === "asc" ? "desc" : "asc";
    } else {
      sortCol = col;
      sortDir = "desc";
    }
    fetchData();
  });
});

document.getElementById("refreshBtn").addEventListener("click", fetchData);
document.getElementById("filter").addEventListener("input", render);

fetchData();
</script>
</body>
</html>

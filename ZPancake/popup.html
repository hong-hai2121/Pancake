<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Pancake Watcher</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="title-row">
        <h1>Tin nhắn mới phát hiện</h1>
        <label class="power-toggle" title="Tắt/Bật theo dõi">
          <input type="checkbox" id="enabledToggle" checked />
          <span id="enabledLabel">Đang bật</span>
        </label>
      </div>
      <div class="actions">
        <button id="sweepBtn">🔄 Cập nhật</button>
      </div>
      <label class="auto-toggle">
        <input type="checkbox" id="autoSweepToggle" />
        Tự động cập nhật mỗi khi mở trang pancake.vn
      </label>
      <p id="sweepStatus" class="sweep-status"></p>
    </header>
    <ul id="list"></ul>
    <p id="empty" class="empty" hidden>Chưa phát hiện tin nhắn mới nào.</p>
    <script src="popup.js"></script>
  </body>
</html>
